# --- Notificaciones por correo (10.3.2-A) y requisitos de integración I-01 a I-08 ---
# Proveedor: local (por defecto: registra en el log y en la bandeja en memoria; sin internet ni credenciales), smtp (Gmail) o brevo (API HTTPS
# de Brevo, pensada para Render, donde el SMTP saliente suele estar bloqueado). La clave de Brevo va en application-secrets.properties o en variables de entorno.
sga.notificaciones.proveedor=local
# I-03: tiempo máximo de espera del servidor de correo (conexión, lectura y escritura), en milisegundos
sga.notificaciones.tiempo-espera-ms=5000
# Remitente opcional (sga.notificaciones.remitente); por defecto es el usuario de Gmail. Gmail siempre envía desde la cuenta autenticada.
# Cliente SMTP (solo se usa con proveedor=smtp). El usuario y la contrasena de aplicacion NO van aqui:
# se escriben en application-secrets.properties (no versionado) o en las variables SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD (I-06).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${sga.notificaciones.tiempo-espera-ms}
spring.mail.properties.mail.smtp.timeout=${sga.notificaciones.tiempo-espera-ms}
spring.mail.properties.mail.smtp.writetimeout=${sga.notificaciones.tiempo-espera-ms}

# --- Recuperación de contraseña (7.2): el código es de 6 dígitos y de un solo uso ---
sga.recuperacion.vigencia-minutos=15
# Fallos que se toleran antes de bloquear el código (evita adivinarlo por fuerza bruta)
sga.recuperacion.intentos-maximos=5

# --- Imágenes de apartamentos y foto de perfil (7.3, 7.2) e integración de salida I-01 a I-08 ---
# Proveedor del almacén: local (por defecto: carpeta del disco servida en /imagenes/**, sin internet ni credenciales) o cloudinary.
sga.imagenes.proveedor=local
# I-03: tiempo máximo de espera del servicio externo (conexión y petición), en milisegundos
sga.imagenes.tiempo-espera-ms=10000
# Tamaños máximos por imagen, en MB: las de los apartamentos y la foto de perfil (regla 10)
sga.imagenes.tamano-maximo-mb=5
sga.imagenes.tamano-maximo-perfil-mb=2
# Almacén local: carpeta del disco y URL pública con la que el navegador la pide (en despliegue, la URL pública del backend)
sga.imagenes.local.carpeta=./imagenes
sga.imagenes.local.url-base=http://localhost:8080/imagenes
# Cloudinary (solo con proveedor=cloudinary). Las credenciales NO van aquí: sga.imagenes.cloudinary.cloud-name, api-key y api-secret
# se escriben en application-secrets.properties (no versionado) o en variables de entorno (I-06).
sga.imagenes.cloudinary.url-api=https://api.cloudinary.com
# Subida de archivos (Guía 21): techo de Spring por archivo y por petición. El límite del NEGOCIO (5 MB y 2 MB) lo aplica el dominio con su 409.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# --- Canal externo (7.8, 10.3.1) ---
# Canal de DEMOSTRACIÓN que se siembra con los datos de prueba, para ejecutar el simulador de canal (simulador-canal/). Su credencial es pública
# y está en el README: un despliegue real pone sga.datos-prueba.habilitado=false y no queda ninguna credencial conocida. De la credencial solo
# se guarda su hash. Los canales reales se crean con POST /api/canales, que muestra la credencial una sola vez.
sga.canal-demo.codigo=DEMO
sga.canal-demo.nombre=Canal de demostraci\u00f3n (simulador)
sga.canal-demo.credencial=sgc_demo_simulador_canal_2026_no_usar_en_produccion
