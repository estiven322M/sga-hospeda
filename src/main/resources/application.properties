spring.application.name=sga

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080

# --- Zona horaria (regla 15: fechas en hora de Colombia) ---
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Documentación de la API (springdoc / Swagger UI) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Parámetros de la Ficha de Alojamiento (regla 10: nada de negocio quemado en el código) ---
# TODO: confirmar cada valor contra la Ficha de la Entrega 1 antes de cerrar el corte.
# Zona horaria del alojamiento, usada para "ahora" en las reglas de negocio
sga.alojamiento.zona-horaria=America/Bogota
# Hora desde la que el grupo puede entrar (check-in)
sga.alojamiento.hora-entrada=15:00
# Hora máxima de salida del grupo (check-out)
sga.alojamiento.hora-salida=11:00
# Horas de preparación entre la salida de un grupo y la entrada del siguiente (TiempoPreparacion, L-13)
sga.alojamiento.tiempo-preparacion-horas=3
# Horas que puede estar PENDIENTE una reserva antes de vencer (PlazoConfirmacion)
sga.alojamiento.plazo-confirmacion-horas=24
# Edad desde la que un ocupante genera cargo (UmbralEdadFacturable, L-09)
sga.alojamiento.umbral-edad-facturable-anios=12
# Hora del día de entrada a partir de la cual se puede declarar no-show
sga.alojamiento.hora-limite-no-show=22:00
# Porcentaje del total que se cobra como anticipo para confirmar la reserva
sga.alojamiento.anticipo-porcentaje=30

# --- Datos de prueba (regla 12): se cargan solos al iniciar; poner false para arrancar con la base vacía ---
sga.datos-prueba.habilitado=true

# --- Seguridad y JWT (Guía 12) ---
# La clave NO se escribe aquí (12.4). Se lee de application-secrets.properties (no versionado)
# o, en despliegue, de la variable de entorno SGA_JWT_SECRET. Sin ninguna de las dos la aplicación no arranca.
spring.config.import=optional:classpath:application-secrets.properties
sga.jwt.emisor=sga
sga.jwt.expiracion-minutos=30

