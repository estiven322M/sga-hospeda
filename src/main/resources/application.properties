spring.application.name=sga

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
# En Render el puerto lo da la variable PORT
server.port=${PORT:8080}

# --- Zona horaria (regla 15: fechas en hora de Colombia) ---
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Documentación de la API (springdoc / Swagger UI) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Parámetros de la Ficha de Alojamiento (regla 10: nada de negocio quemado en el código) ---
# TODO: confirmar cada valor contra la Ficha de la Entrega 1 antes de cerrar el corte.
# Zona horaria del alojamiento, usada para "ahora" en las reglas de negocio
sga.alojamiento.zona-horaria=America/Bogota
# Hora desde la que el grupo puede entrar (check-in)
sga.alojamiento.hora-entrada=15:00
# Hora máxima de salida del grupo (check-out)
sga.alojamiento.hora-salida=11:00
# Horas de preparación entre la salida de un grupo y la entrada del siguiente (TiempoPreparacion, L-13)
sga.alojamiento.tiempo-preparacion-horas=3
# Horas que puede estar PENDIENTE una reserva antes de vencer (PlazoConfirmacion)
sga.alojamiento.plazo-confirmacion-horas=24
# Edad desde la que un ocupante genera cargo (UmbralEdadFacturable, L-09)
sga.alojamiento.umbral-edad-facturable-anios=12
# Hora del día de entrada a partir de la cual se puede declarar no-show
sga.alojamiento.hora-limite-no-show=22:00
# Porcentaje del total que se cobra como anticipo para confirmar la reserva
sga.alojamiento.anticipo-porcentaje=30

# L-18 - Medios de pago que el alojamiento acepta (separados por comas; al menos dos). Un pago con otro medio se rechaza.
sga.alojamiento.medios-pago=EFECTIVO,TARJETA,TRANSFERENCIA
# 7.5 - Máximo de noches que admite una consulta de calendario de ocupación
sga.alojamiento.calendario-maximo-noches=62

# L-01, L-02, L-16 - Datos del alojamiento. Siembran el alojamiento la primera vez que arranca el sistema; después el
# administrador los edita desde la aplicación (las horas de entrada y salida de arriba son los valores de partida).
# (Los valores con tildes van con escapes Unicode: Spring lee este archivo como ISO-8859-1.)
sga.alojamiento.nombre=Hospeda Salento
sga.alojamiento.descripcion=Apartamentos tur\u00edsticos con vista al Valle del Cocora, a pocos pasos de la plaza principal de Salento.
sga.alojamiento.ciudad=Salento, Quind\u00edo
sga.alojamiento.direccion=Carrera 6 # 3-45, Salento, Quind\u00edo
sga.alojamiento.latitud=4.6368
sga.alojamiento.longitud=-75.5700
sga.alojamiento.normas-convivencia=Silencio entre las 10 p. m. y las 7 a. m. No se permite fumar dentro de los apartamentos. Las fiestas y los eventos requieren autorizaci\u00f3n. Los da\u00f1os en el apartamento se cargan al titular de la reserva.
# L-16 - Decisión explícita sobre las mascotas
sga.alojamiento.politica-mascotas=No se aceptan mascotas.

# L-20 - Reglas propias del alojamiento (aprobación del docente solicitada el 15-nov-2026)
# RP-01 Estancia mínima por temporada: si alguna noche cae en la temporada, la estancia debe tener al menos estas noches.
#       La clave es el nombre de la temporada; las temporadas que no figuran no exigen mínimo.
sga.alojamiento.estancia-minima.ALTA=3
sga.alojamiento.estancia-minima.MEDIA=2
# RP-02 Descuento por estancia larga: desde estas noches se descuenta este porcentaje del total, una sola vez (0 = sin descuento)
sga.alojamiento.descuento-estancia-larga-noches=7
sga.alojamiento.descuento-estancia-larga-porcentaje=10
# RP-03 Adulto responsable: toda reserva incluye al menos un ocupante con esta edad (en años) o más a la fecha de entrada
sga.alojamiento.edad-adulto-responsable-anios=18

# --- Datos de prueba (regla 12): se cargan solos al iniciar; poner false para arrancar con la base vacía ---
sga.datos-prueba.habilitado=true

# --- Seguridad y JWT (Guía 12) ---
# La clave NO se escribe aquí (12.4). Se lee de application-secrets.properties (no versionado)
# o, en despliegue, de la variable de entorno SGA_JWT_SECRET. Sin ninguna de las dos la aplicación no arranca.
# Archivo local de secretos: optional (en Render no existe), fuera del jar y con menos prioridad que las variables de entorno
spring.config.import=optional:file:./src/main/resources/application-secrets.properties
# CORS: orígenes del frontend autorizados a llamar a la API, separados por comas (nunca * : el token viaja en un encabezado)
sga.cors.origenes-permitidos=http://localhost:5173
sga.jwt.emisor=sga
sga.jwt.expiracion-minutos=30

