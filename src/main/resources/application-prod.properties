# Perfil de producción (Render): SPRING_PROFILES_ACTIVE=prod. Todo lo secreto o propio del entorno llega por variables de entorno
# (ver docs/despliegue.md). Si falta una variable obligatoria (sin valor por defecto) la aplicación NO arranca y el error nombra la variable.
# La base es H2 en memoria: se reinicia en cada arranque (Render gratuito duerme el servicio) y los datos de prueba se siembran de nuevo.

# --- Cosas de desarrollo apagadas ---
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Actuator: solo health (comprobación de salud de Render; público en SecurityConfig) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El indicador de correo intenta conectar con el SMTP (Gmail) y dejaría /actuator/health en DOWN; el correo de prod va por Brevo (HTTPS)
management.health.mail.enabled=false

# --- JWT (obligatoria, mínimo 32 caracteres: la valida JwtConfig) ---
sga.jwt.secret=${SGA_JWT_SECRET}

# --- CORS: orígenes del frontend separados por comas. Vacía = ningún origen autorizado (no rompe el arranque) ---
sga.cors.origenes-permitidos=${SGA_CORS_ALLOWED_ORIGINS:}

# --- Usuarios iniciales: uno por rol. Reemplazan POR COMPLETO la lista de application.properties (contraseñas públicas no se usan) ---
# La base se borra al dormirse el servicio, así que se recrean en cada arranque: debe ir en true.
sga.usuarios-iniciales.habilitado=${SGA_USUARIOS_INICIALES_HABILITADOS:true}

sga.usuarios-iniciales.usuarios[0].nombre=Administrador SGA
sga.usuarios-iniciales.usuarios[0].correo=${SGA_ADMIN_CORREO}
sga.usuarios-iniciales.usuarios[0].contrasena=${SGA_ADMIN_CONTRASENA}
sga.usuarios-iniciales.usuarios[0].telefono=3001000001
sga.usuarios-iniciales.usuarios[0].documento=1000000001
sga.usuarios-iniciales.usuarios[0].fecha-nacimiento=1985-03-14
sga.usuarios-iniciales.usuarios[0].rol=ADMINISTRADOR

sga.usuarios-iniciales.usuarios[1].nombre=Recepcion Hospeda
sga.usuarios-iniciales.usuarios[1].correo=${SGA_RECEPCION_CORREO}
sga.usuarios-iniciales.usuarios[1].contrasena=${SGA_RECEPCION_CONTRASENA}
sga.usuarios-iniciales.usuarios[1].telefono=3001000002
sga.usuarios-iniciales.usuarios[1].documento=1000000002
sga.usuarios-iniciales.usuarios[1].fecha-nacimiento=1990-07-22
sga.usuarios-iniciales.usuarios[1].rol=RECEPCIONISTA

sga.usuarios-iniciales.usuarios[2].nombre=Personal de Servicio
sga.usuarios-iniciales.usuarios[2].correo=${SGA_SERVICIO_CORREO}
sga.usuarios-iniciales.usuarios[2].contrasena=${SGA_SERVICIO_CONTRASENA}
sga.usuarios-iniciales.usuarios[2].telefono=3001000003
sga.usuarios-iniciales.usuarios[2].documento=1000000003
sga.usuarios-iniciales.usuarios[2].fecha-nacimiento=1992-11-05
sga.usuarios-iniciales.usuarios[2].rol=PERSONAL_SERVICIO

# El huésped conserva el documento 1094000111: las reservas sembradas son de ese titular (SembradorReservasPrueba)
sga.usuarios-iniciales.usuarios[3].nombre=Laura Gomez
sga.usuarios-iniciales.usuarios[3].correo=${SGA_HUESPED_CORREO}
sga.usuarios-iniciales.usuarios[3].contrasena=${SGA_HUESPED_CONTRASENA}
sga.usuarios-iniciales.usuarios[3].telefono=3001000004
sga.usuarios-iniciales.usuarios[3].documento=1094000111
sga.usuarios-iniciales.usuarios[3].fecha-nacimiento=1995-01-30
sga.usuarios-iniciales.usuarios[3].rol=HUESPED

# --- Canal DEMO (credencial pública): apagado en prod salvo SGA_CANAL_DEMO_HABILITADO=true ---
sga.canal-demo.habilitado=${SGA_CANAL_DEMO_HABILITADO:false}

# --- Integraciones (I-02): sin variables se usa el adaptador local ---
sga.notificaciones.proveedor=${SGA_NOTIFICACIONES_PROVEEDOR:local}
sga.notificaciones.brevo.api-key=${SGA_NOTIFICACIONES_BREVO_API_KEY:}
sga.notificaciones.brevo.remitente=${SGA_NOTIFICACIONES_BREVO_REMITENTE:}

sga.imagenes.proveedor=${SGA_IMAGENES_PROVEEDOR:local}
sga.imagenes.cloudinary.cloud-name=${SGA_IMAGENES_CLOUDINARY_CLOUD_NAME:}
sga.imagenes.cloudinary.api-key=${SGA_IMAGENES_CLOUDINARY_API_KEY:}
sga.imagenes.cloudinary.api-secret=${SGA_IMAGENES_CLOUDINARY_API_SECRET:}
# URL pública del backend + /imagenes: con ella el navegador pide las imágenes de ejemplo sembradas (almacén local)
sga.imagenes.local.url-base=${SGA_IMAGENES_LOCAL_URL_BASE:http://localhost:8080/imagenes}

# IA no bloqueante (L-21, paso M3): las propiedades quedan listas; hoy ninguna clase las consume.
sga.ia.habilitada=${SGA_IA_HABILITADA:false}
sga.ia.clave=${SGA_IA_CLAVE:}
