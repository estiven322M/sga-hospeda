# Solo para las pruebas automáticas (Guía 12). Las pruebas que levantan el contexto de Spring (@SpringBootTest)
# necesitan una clave JWT, y en GitHub Actions o en un clon nuevo no existe application-secrets.properties.
# Esta clave NO es la de la aplicación: es pública, vive solo en el classpath de pruebas y nunca se despliega.
# Spring Boot lee classpath:/config/application.properties además de application.properties y le da prioridad.
sga.jwt.secret=clave-publica-solo-para-pruebas-automaticas-no-usar-en-despliegue
