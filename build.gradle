plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.edu.uniquindio'
version = '0.0.1-SNAPSHOT'
description = 'SGA - Sistema de Gestión de Alojamiento'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Consola web de H2, disponible en /h2-console
    implementation 'org.springframework.boot:spring-boot-h2console'

    // Acceso a la base de datos mediante JPA e Hibernate
    // Base de los adaptadores de persistencia del SGA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Validación de los datos que entran al sistema (formato de la petición)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Servidor web y API REST. En Spring Boot 4 este starter se llama
    // 'webmvc'; en versiones anteriores se llamaba 'web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Documentación de la API: genera /v3/api-docs y la interfaz Swagger UI en /swagger-ui.html.
    // La línea 3.x de springdoc es la compatible con Spring Boot 4
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // --- Seguridad: Spring Security + validación de JWT (Guía 12) ---
    // Spring Security protege el ciclo HTTP con una cadena de filtros (SecurityFilterChain)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Servidor de recursos OAuth2: sabe firmar (NimbusJwtEncoder) y validar (NimbusJwtDecoder) el JWT.
    // En Spring Boot 4 se llama 'security-oauth2-resource-server' (antes 'oauth2-resource-server')
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // MapStruct: genera en compilación los mappers DTO <-> dominio y JPA <-> dominio
    implementation 'org.mapstruct:mapstruct:1.6.3'

    // Generación automática de getters, setters y constructores en tiempo de compilación
    compileOnly 'org.projectlombok:lombok'

    // Motor de la base de datos H2
    runtimeOnly 'com.h2database:h2'

    // Procesador de anotaciones para Lombok durante la compilación del código principal
    annotationProcessor 'org.projectlombok:lombok'

    // Procesador de MapStruct que escribe la implementación de cada mapper
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Hace que MapStruct espere a que Lombok genere los getters antes de usarlos
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Soporte de pruebas para persistencia (JPA)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // Soporte de pruebas para las validaciones de entrada
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'

    // Soporte de pruebas para controladores y endpoints de la API REST (WebMVC)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // Permite usar Lombok en las clases que están dentro del paquete src/test/java al compilar
    testCompileOnly 'org.projectlombok:lombok'

    // Lanzador de JUnit necesario para ejecutar las pruebas desde Gradle
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Procesador de anotaciones para Lombok durante la compilación de las clases de prueba
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs('-XX:+EnableDynamicAgentLoading') // Autoriza a Mockito en Java 25
}
